<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="MindYoga × KAION salon in Singapore. Reserve your seat.">
<meta property="og:title" content="MindYoga × KAION Salon">
<meta property="og:description" content="What happens when an AI joins the circle? One evening in Singapore.">
<meta property="og:image" content="img/salon-2.jpg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>KAION × Mind Yoga Salon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Instrument+Sans:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+Tamil:wght@400;600;800&display=swap">
<style>
/* Layout: one centred column, phone first. KAION's warm sand and halo meet MindYoga's ink green, gold and butterfly. */
:root{
  --bg:#F2EBE4;          /* KAION sand */
  --surface:#FBF8F4;
  --fg:#1C2420;
  --muted:#6E6760;
  --line:#E2D8CD;
  --brand:#2C3E36;       /* MindYoga ink green */
  --brand-fg:#F6F1EA;
  --gold:#B08C52;        /* MindYoga gold, small accents only */
  --signal:#D9472B;      /* live dot */
  --halo:rgba(255,255,255,.95);
  --globe-base:#EDE6DE;
  --nav-bg:#1C2420;
  --nav-fg:#F2EBE4;
  --display:"Archivo","Noto Sans SC","Noto Sans Tamil",system-ui,sans-serif;
  --body:"Instrument Sans","Noto Sans SC","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Cormorant Garamond","Noto Serif SC",Georgia,serif;
  --radius:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121915;--surface:#1A231E;--fg:#EFE9E1;--muted:#A79F95;--line:#2B3630;
  --brand:#D9BC8C;--brand-fg:#121915;--gold:#D9BC8C;--signal:#F06A4E;--halo:rgba(255,246,232,.32);--globe-base:#25302A;--nav-bg:#EFE9E1;--nav-fg:#121915;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121915;--surface:#1A231E;--fg:#EFE9E1;--muted:#A79F95;--line:#2B3630;
  --brand:#D9BC8C;--brand-fg:#121915;--gold:#D9BC8C;--signal:#F06A4E;--halo:rgba(255,246,232,.32);--globe-base:#25302A;--nav-bg:#EFE9E1;--nav-fg:#121915;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* brand marks drawn as masks so they follow the theme colour */
.m-bf{display:inline-block;background:currentColor;-webkit-mask:url(img/mindyoga-butterfly.png) center/contain no-repeat;mask:url(img/mindyoga-butterfly.png) center/contain no-repeat;aspect-ratio:480/435}
.m-my{display:inline-block;background:currentColor;-webkit-mask:url(img/mindyoga-logo.png) center/contain no-repeat;mask:url(img/mindyoga-logo.png) center/contain no-repeat;aspect-ratio:436/480}
.m-ka{display:inline-block;background:currentColor;-webkit-mask:url(img/kaion-wordmark.png) center/contain no-repeat;mask:url(img/kaion-wordmark.png) center/contain no-repeat;aspect-ratio:1624/396}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;overflow:hidden;
  transition:transform .95s cubic-bezier(.75,0,.2,1),border-radius .95s;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#intro.leave{transform:translateY(-104%);border-radius:0 0 40px 40px}
.say{position:absolute;max-width:min(560px,88vw);text-align:center;font-family:var(--display);font-weight:700;
  font-size:clamp(22px,4.4vw,34px);line-height:1.22;letter-spacing:-.02em;text-wrap:balance;transition:opacity .45s,transform .45s}
:root[lang="ta"] .say{font-size:clamp(19px,3.6vw,28px);letter-spacing:0}
.say.out{opacity:0;transform:translateY(-10px)}
.w{opacity:.13;transition:opacity .4s}
.w.on{opacity:1}
.w.hl{color:var(--gold)}
.w.ul{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--gold)}
.stack{position:absolute;width:min(230px,54vw);aspect-ratio:4/4.2;transition:transform .9s cubic-bezier(.6,0,.2,1),opacity .4s}
.stack.dock{transform:translateY(min(36vh,320px)) scale(.34)}
.pol{position:absolute;inset:0;background:#fff;padding:8px 8px 30px;border-radius:3px;box-shadow:0 18px 40px rgba(40,30,20,.22),0 2px 6px rgba(40,30,20,.12);
  opacity:0;transform:translateY(-40px) scale(1.25) rotate(var(--r))}
.pol img{width:100%;height:100%;object-fit:cover;display:block;border-radius:1px}
.pol.in{animation:drop .55s cubic-bezier(.2,.9,.25,1.15) forwards}
@keyframes drop{to{opacity:1;transform:translateY(0) scale(1) rotate(var(--r))}}
.stamp{position:absolute;text-align:center;font-family:var(--display);font-weight:900;font-stretch:125%;line-height:.86;letter-spacing:-.01em;
  font-size:clamp(44px,11vw,112px);text-transform:uppercase;transition:opacity .4s}
.stamp .pre{opacity:0;transition:opacity .3s;display:block;font-weight:700;font-stretch:100%;font-size:clamp(18px,3vw,24px);letter-spacing:-.01em;text-transform:none;margin-bottom:.5em}
.stamp .ch{display:inline-block;opacity:0;transform:scale(1.8) translateY(-6px)}
.stamp .ch.on{animation:stampin .32s cubic-bezier(.2,.9,.2,1.2) forwards}
.stamp .x{color:var(--gold)}
#stx{margin:.1em 0 .14em}
@keyframes stampin{to{opacity:1;transform:none}}
.duo{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,26px);margin-top:.5em;font-size:16px;opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s}
.duo.on{opacity:1;transform:none}
.duo .m-my{height:clamp(64px,10vw,92px);color:var(--brand)}
.duo .x{font:500 22px var(--body);color:var(--gold)}
.duo .ka{position:relative;display:grid;place-items:center;width:clamp(110px,16vw,150px);aspect-ratio:1}
.duo .ka::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 52%,var(--halo) 60%,transparent 72%);filter:blur(6px)}
.duo .ka .m-ka{position:relative;width:76%;color:var(--fg)}
#skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));font:500 14px var(--body);
  background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:9px 16px;cursor:pointer}
#skip:hover{color:var(--fg)}

/* ---------- nav ---------- */
.nav{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;display:flex;justify-content:center;pointer-events:none;margin-top:14px}
.pill{pointer-events:auto;display:flex;align-items:center;gap:4px;background:var(--nav-bg);color:var(--nav-fg);border-radius:999px;padding:6px 6px 6px 14px;
  box-shadow:0 10px 30px rgba(30,20,10,.18);max-width:100%}
.mark{display:flex;align-items:center;gap:7px;margin-right:6px;text-decoration:none}
.mark .m-bf{height:22px}.mark .m-ka{height:11px}.mark i{font-style:normal;opacity:.6;font-size:12px}
.pill .lk{font:500 14px var(--body);color:inherit;text-decoration:none;opacity:.78;padding:8px 10px;border-radius:999px}
.pill .lk:hover{opacity:1}
.langsel{position:relative;display:flex;align-items:center}
.langsel select{appearance:none;-webkit-appearance:none;font:500 14px var(--body);color:var(--nav-fg);background:transparent;border:1px solid color-mix(in srgb,var(--nav-fg) 25%,transparent);
  border-radius:999px;padding:7px 26px 7px 12px;cursor:pointer;max-width:110px}
.langsel select option{color:#1C2420;background:#fff}
.langsel::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;opacity:.7}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 15px var(--body);background:var(--brand);color:var(--brand-fg);border:0;border-radius:999px;padding:12px 22px;
  text-decoration:none;cursor:pointer;transition:transform .15s,filter .15s;text-align:center}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.sm{padding:9px 15px;font-size:14px}
.pill .btn{background:#2C3E36;color:#F6F1EA;margin-left:4px}
.arrow{transition:transform .2s}.btn:hover .arrow{transform:translateX(3px)}

/* ---------- hero ---------- */
.hero{text-align:center;padding-block:52px 0;display:flex;flex-direction:column;align-items:center;gap:18px}
.chip{font:500 13px var(--body);font-variant-numeric:tabular-nums;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 13px}
.h1wrap{position:relative;display:inline-block}
h1{white-space:pre-line;font-family:var(--display);font-weight:800;font-stretch:96%;font-size:clamp(38px,7.4vw,76px);line-height:1.0;letter-spacing:-.035em;margin:0;max-width:13ch;text-wrap:balance}
:root[lang="zh-Hans"] h1{font-size:clamp(34px,6.4vw,68px);line-height:1.12;letter-spacing:-.01em;max-width:none}
:root[lang="ta"] h1{font-size:clamp(27px,5vw,52px);line-height:1.25;letter-spacing:0;max-width:20ch}
:root[lang="ms"] h1{font-size:clamp(34px,6.4vw,66px);max-width:15ch}
.hero .flyer{position:absolute;right:-.55em;top:-.62em;width:.95em;color:var(--gold);font-size:clamp(38px,7.4vw,76px);pointer-events:none}
.flyer .m-bf{width:100%;transform-origin:50% 60%;animation:flap 2.8s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotateY(0) rotate(-4deg)}45%{transform:rotateY(52deg) rotate(2deg)}55%{transform:rotateY(48deg) rotate(2deg)}}
body.revealed .flyer{animation:flyin 1.6s cubic-bezier(.3,.7,.2,1) .3s both}
@keyframes flyin{0%{opacity:0;transform:translate(-60vw,30vh) rotate(-30deg) scale(.6)}60%{opacity:1}100%{transform:none}}
.lede{color:var(--muted);font-size:clamp(16px,2vw,18px);max-width:54ch;margin:0;text-wrap:pretty}
.live{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap;justify-content:center}
.live b{color:var(--fg);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--signal);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--signal) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.lbl{font-weight:700;color:var(--fg);letter-spacing:.04em;font-size:12.5px}
.avs{display:flex}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--body);color:var(--brand-fg);background:var(--brand);border:2px solid var(--bg);margin-left:-6px}
.av:first-child{margin-left:0}
body.revealed .hero>*:not(.globe){animation:up .7s cubic-bezier(.2,.8,.2,1) both}
body.revealed .hero>*:nth-child(2){animation-delay:.06s}body.revealed .hero>*:nth-child(3){animation-delay:.12s}
body.revealed .hero>*:nth-child(4){animation-delay:.18s}body.revealed .hero>*:nth-child(5){animation-delay:.24s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}

/* globe with KAION halo */
.globe{position:relative;width:min(640px,100%);aspect-ratio:1/.8;overflow:hidden;margin-top:6px;touch-action:pan-y;
  -webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 98%);mask-image:linear-gradient(to bottom,#000 72%,transparent 98%)}
.globe .halo{position:absolute;left:0;top:0;width:100%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,transparent 0 37%,var(--halo) 41.5%,transparent 52%);filter:blur(10px);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03);opacity:.8}}
.globe canvas{position:relative;width:100%;aspect-ratio:1;display:block;cursor:grab;opacity:0;transition:opacity 1s}
.globe canvas.ready{opacity:1}
.globe canvas:active{cursor:grabbing}
.pin{position:absolute;left:50%;top:72%;transform:translate(-14px,-50%);display:flex;align-items:center;gap:6px;background:var(--surface);color:var(--fg);
  border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 5px;font:600 13px var(--body);box-shadow:0 6px 18px rgba(30,20,10,.14);
  opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}
.pin.on{opacity:1}
.pin i{width:18px;height:18px;border-radius:50%;background:var(--signal);color:#fff;display:grid;place-items:center}
.pin i .m-bf{width:12px;color:#fff}
.pin small{color:var(--muted);font-weight:500}

/* facts */
.hero:has(.globe[hidden]){padding-bottom:56px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:-28px 0 0;position:relative}
.fact{background:var(--surface);padding:18px 20px;min-width:0}
.fact dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fact dd{margin:4px 0 0;font-weight:600;font-size:17px;line-height:1.3}
@media (max-width:720px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.fact{padding:14px 16px}.fact dd{font-size:15.5px}}

/* sections */
section.blk{padding-block:88px 0}
.band+section.blk{padding-top:96px}
@media (max-width:600px){section.blk{padding-block:64px 0}}
.eyebrow{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 10px}
h2{font-family:var(--display);font-weight:800;font-stretch:96%;font-size:clamp(28px,4.6vw,46px);letter-spacing:-.03em;line-height:1.06;margin:0 0 28px;text-wrap:balance}
:root[lang="ta"] h2{font-size:clamp(23px,3.6vw,36px);letter-spacing:0;line-height:1.3}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.flow li{border-top:2px solid var(--fg);padding-top:14px;min-width:0}
.flow time{font:600 14px var(--body);font-variant-numeric:tabular-nums;color:var(--muted)}
.flow h3{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.015em;margin:6px 0 6px}
.flow p{margin:0;color:var(--muted)}
@media (max-width:720px){.flow{grid-template-columns:1fr;gap:22px}}

/* slogan band */
.band{width:100vw;margin:88px 0 0 calc(50% - 50vw);background:#2C3E36;color:#F1E9DC;overflow:hidden;padding-block:22px;transform:rotate(-1.2deg)}
.track{display:flex;width:max-content;gap:28px;align-items:center;animation:marq 38s linear infinite;white-space:nowrap}
.track span{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(24px,3.4vw,36px)}
.track span.k{font-family:var(--display);font-style:normal;font-weight:600;font-size:clamp(19px,2.6vw,27px);letter-spacing:-.01em}
.track .m-bf{width:34px;color:#D9BC8C;flex:0 0 auto}
@keyframes marq{to{transform:translateX(-50%)}}
/* hosts */
.hosts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.hosts{grid-template-columns:1fr}}
.host{border-radius:22px;padding:clamp(22px,4vw,36px);display:flex;flex-direction:column;gap:14px;min-width:0;position:relative;overflow:hidden}
.host.my{background:#2C3E36;color:#F1E9DC}
.host.my .m-my{height:96px;color:#D9BC8C;align-self:flex-start}
.host.my .slogan{font-family:var(--serif);font-weight:500;font-style:italic;font-size:clamp(24px,3vw,30px);line-height:1.15;color:#D9BC8C;margin:0}
.host.my p{margin:0;color:rgba(241,233,220,.78)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:6px;padding-top:16px;border-top:1px solid rgba(217,188,140,.3)}
.stats b{display:block;font-family:var(--display);font-size:26px;font-weight:800;color:#F1E9DC;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats span{font-size:12.5px;color:rgba(241,233,220,.7);line-height:1.3;display:block}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.host.ka{background:#EFE4DA;color:#1D2233}
.host.ka .kalogo{position:relative;width:150px;aspect-ratio:1;display:grid;place-items:center;align-self:flex-start;margin:-18px 0 -14px -18px}
.host.ka .kalogo::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 50%,rgba(255,255,255,.98) 58%,transparent 72%);filter:blur(5px);animation:breathe 6s ease-in-out infinite}
.host.ka .m-ka{position:relative;width:70%;color:#1D2233}
.host.ka .slogan{font-family:var(--display);font-weight:600;font-size:clamp(21px,2.6vw,26px);line-height:1.2;letter-spacing:-.015em;margin:0}
.host.ka p{margin:0;color:#4E4A55}
.stores{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.store{display:inline-flex;align-items:center;gap:8px;background:#1D2233;color:#EFE4DA;text-decoration:none;border-radius:10px;padding:8px 14px;font:600 14px var(--body)}
.store svg{width:16px;height:16px;fill:currentColor}
.host .tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.65}
.waves{display:flex;align-items:center;gap:3px;height:22px}
.waves span{width:3px;border-radius:2px;background:#1D2233;opacity:.55;animation:wv 1.2s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.35)}}

/* form */
.formgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:48px;align-items:start}
@media (max-width:820px){.formgrid{grid-template-columns:1fr;gap:20px}}
.side p{color:var(--muted);margin:0 0 14px;max-width:40ch}
.side .polmini{display:flex;margin-top:22px}
.side .polmini img{width:92px;height:92px;object-fit:cover;border:5px solid #fff;border-bottom-width:16px;border-radius:2px;box-shadow:0 8px 20px rgba(30,20,10,.16);margin-right:-18px}
.side .polmini img:nth-child(1){transform:rotate(-6deg)}.side .polmini img:nth-child(2){transform:rotate(4deg) translateY(6px)}.side .polmini img:nth-child(3){transform:rotate(-2deg)}
@media (max-width:820px){.side .polmini{display:none}}
form{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,30px);display:grid;gap:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
.f{display:grid;gap:6px;min-width:0}
.f>label,.f>.lg{font-weight:600;font-size:14.5px}
.f .opt{font-weight:500;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],textarea,select.inp{width:100%;font:16px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 13px;transition:border-color .15s,background .15s}
input:focus,textarea:focus,select.inp:focus{outline:none;border-color:var(--brand);background:var(--surface)}
textarea{min-height:84px;resize:vertical}
.tel{display:flex;gap:8px}.tel select{width:auto;flex:0 0 auto}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-size:14.5px;cursor:pointer;background:var(--bg);transition:all .15s}
.seg input:checked+span{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.seg input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);cursor:pointer}
.chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--brand);flex:0 0 auto}
.err{color:var(--signal);font-size:13px}
.err:empty{display:none}
.invalid{border-color:var(--signal)!important}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
form .btn{justify-self:start;padding:14px 26px;font-size:16px}
@media (max-width:560px){form .btn{justify-self:stretch;justify-content:center}}
form .btn[disabled]{opacity:.6;cursor:progress}
.demo{font-size:13px;color:var(--muted);margin:-6px 0 0}

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const sstore = {get(k){try{return sessionStorage.getItem(k)}catch(e){return null}}, set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const params = new URLSearchParams(location.search);
let L = params.get("lang") || sstore.get("kmy_lang") || "en";   // 默认英语；切换的语言只在这次打开期间有效，重新扫码一律英文
if (!T[L]) L = "en";
const t = k => (T[L][k] || T.en[k] || "");
const SRC = params.get("src") || "";

function applyLang(){
  document.documentElement.lang = L === "zh" ? "zh-Hans" : L;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-cfg]").forEach(el => { const v = CONFIG[el.dataset.cfg]; el.textContent = typeof v === "object" ? (v[L] || v.en) : v; });
  fillBand();
  $("#lang").value = L;
  $("#pinName").textContent = PLACE[L];
  $("#privacy").textContent = t("privacy") + (CONFIG.contact ? " " + t("privacy_c").replace("{c}", CONFIG.contact) : "");
  $("#demoTag").textContent = t("demo");
  tick();
  if (lastResult) showDone(lastResult);
}
$("#lang").onchange = e => { L = e.target.value; sstore.set("kmy_lang", L); applyLang(); };

/* countdown */
function tick(){
  if (!CONFIG.closesAt) { $("#chip").textContent = t("chip_soon"); return; }
  const ms = new Date(CONFIG.closesAt) - Date.now();
  if (ms <= 0) { $("#chip").textContent = t("chip_closed"); return; }
  const d = Math.floor(ms/864e5), h = Math.floor(ms/36e5)%24, m = Math.floor(ms/6e4)%60, s = Math.floor(ms/1e3)%60;
  const p = n => String(n).padStart(2,"0");
  $("#chip").textContent = `${t("chip")} ${d}d ${p(h)}h ${p(m)}m ${p(s)}s`;
}
setInterval(tick, 1000);

/* ================= intro ================= */
// *word* = gold, ~word~ = underline. Chinese reveals by character, other languages by word.
function words(el, text){
  el.innerHTML = "";
  const out = [];
  const marked = text.replace(/\*([^*]+)\*/g, (m,g) => "\u0001" + g + "\u0002").replace(/~([^~]+)~/g, (m,g) => "\u0003" + g + "\u0004");
  let hl = false, ul = false;
  const tokens = L === "zh" ? marked.match(/[\u0001-\u0004]|[A-Za-z]+|\s+|./gu) : marked.match(/[\u0001-\u0004]|\s+|[^\s\u0001-\u0004]+/gu);
  for (const tk of tokens || []) {
    if (tk === "\u0001") { hl = true; continue; } if (tk === "\u0002") { hl = false; continue; }
    if (tk === "\u0003") { ul = true; continue; } if (tk === "\u0004") { ul = false; continue; }
    if (/^\s+$/.test(tk)) { el.append(" "); continue; }
    const s = document.createElement("span"); s.className = "w" + (hl ? " hl" : "") + (ul ? " ul" : ""); s.textContent = tk; el.append(s); out.push(s);
  }
  return out;
}
let skipped = false;
async function say(id, key, step = 85, hold = 900){
  const el = $(id); el.classList.remove("out");
  const ws = words(el, t(key));
  for (const w of ws) { if (skipped) return; w.classList.add("on"); await sleep(L === "zh" ? step * .5 : step); }
  await sleep(hold); if (skipped) return;
  el.classList.add("out"); await sleep(380);
}
function stampLine(el, text){ el.innerHTML = ""; return [...text].map(c => { const s = document.createElement("span"); s.className = "ch" + (c === "×" ? " x" : ""); s.textContent = c === " " ? " " : c; el.append(s); return s; }); }
async function intro(){
  const pols = [...document.querySelectorAll(".pol")];
  const run = async () => {
    await sleep(300);
    await say("#s1", "i1", 150, 1200); if (skipped) return;
    for (const p of pols) { if (skipped) return; p.classList.add("in"); await sleep(340); }
    await sleep(450); $("#stack").classList.add("dock"); await sleep(900); if (skipped) return;
    await say("#s2", "i2", 80, 1400); if (skipped) return;
    await say("#s3", "i3", 85, 700); if (skipped) return;
    $("#stack").style.opacity = 0;
    $("#stamp .pre").style.opacity = 1;
    const a = stampLine($("#st1"), "Kaion"), x = stampLine($("#stx"), "×"), b = stampLine($("#st2"), "Mind Yoga");
    for (const c of [...a, ...x, ...b]) { if (skipped) return; c.classList.add("on"); await sleep(70); }
    $("#duo").classList.add("on");
    await sleep(1500); if (skipped) return;
    $("#stamp").style.opacity = 0; await sleep(380);
    await say("#s4", "i4", 120, 700);
  };
  await Promise.race([run(), new Promise(r => $("#skip").onclick = () => { skipped = true; r(); })]);
  finishIntro();
}
function finishIntro(){
  sstore.set("kmy_intro_seen", "1");
  const el = $("#intro"); el.classList.add("leave");
  document.body.classList.remove("locked"); document.body.classList.add("revealed");
  setTimeout(() => el.remove(), 1000);
  startGlobe();
}

/* ================= globe ================= */
let globeStarted = false;
async function startGlobe(){
  if (globeStarted) return; globeStarted = true;
  const cv = $("#cv");
  let createGlobe;
  try { ({ default: createGlobe } = await import("https://cdn.jsdelivr.net/npm/cobe@0.6.3/+esm")); }
  catch (e) { $("#globe").hidden = true; return; }
  const SG = [1.3521, 103.8198];
  const target = Math.PI - (SG[1] * Math.PI / 180 - Math.PI / 2);   // cobe: longitude → phi
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let phi = reduce ? target : target - 2.6, drag = null, settled = false;
  const theta = 0.22, t0 = performance.now();
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const rgb = v => { const c = css(v).replace("#",""); return [0,2,4].map(i => parseInt(c.slice(i,i+2),16)/255); };
  const isDark = () => { const c = css("--bg").replace("#",""); return parseInt(c.slice(0,2),16) < 100; };
  let size = cv.offsetWidth, dark = isDark();
  const opts = () => ({ dark: dark ? 1 : 0, mapBrightness: dark ? 4.5 : 5.2, baseColor: rgb("--globe-base"), glowColor: dark ? [0.2,0.24,0.21] : [0.98,0.95,0.92] });
  createGlobe(cv, {
    devicePixelRatio: 2, width: size * 2, height: size * 2, phi, theta, diffuse: 1.15, mapSamples: 18000,
    markerColor: [0.85,0.28,0.17], markers: [{ location: SG, size: 0.07 }], ...opts(),
    onRender(s) {
      if (!drag) phi += (target - phi) * (reduce ? 1 : 0.035);
      if (!settled && Math.abs(target - phi) < 0.02) { settled = true; $("#pin").classList.add("on"); }
      const el = (performance.now() - t0) / 1000;
      s.phi = phi; s.theta = theta; s.width = size * 2; s.height = size * 2;
      s.markers = [{ location: SG, size: 0.06 + 0.025 * (1 + Math.sin(el * 3)) / 2 }];
      if (dark !== isDark()) { dark = isDark(); Object.assign(s, opts()); }
    }
  });
  requestAnimationFrame(() => cv.classList.add("ready"));
  addEventListener("resize", () => size = cv.offsetWidth);
  cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, p: phi }; cv.setPointerCapture(e.pointerId); $("#pin").classList.remove("on"); settled = false; });
  cv.addEventListener("pointermove", e => { if (drag) phi = drag.p + (e.clientX - drag.x) / 160; });
  const up = () => { drag = null; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
}

/* ================= live count ================= */
const DEMO = !CONFIG.endpoint;
function demoRows(){ try { return JSON.parse(store.get("kmy_demo_rows") || "[]"); } catch(e) { return []; } }
function renderLive(count, recent){
  $("#count").textContent = count;
  const avs = $("#avs"); avs.innerHTML = "";
  (recent || []).slice(-3).forEach(i => { const s = document.createElement("span"); s.className = "av"; s.textContent = i; avs.append(s); });
  $("#recentWrap").hidden = !(recent && recent.length);
}
async function refreshCount(){
  if (DEMO) { const r = demoRows(); renderLive(r.reduce((a,x) => a + +x.seats, 0), r.map(x => [...x.name.trim()][0].toUpperCase())); return; }
  try { const r = await (await fetch(CONFIG.endpoint + "?action=count")).json(); if (r.ok) renderLive(r.count, r.recent); } catch(e) {}
}

/* ================= form ================= */
const form = $("#form");
let lastResult = null;
function setErr(id, key){ $("#e_"+id).textContent = key ? t(key) : ""; const inp = $("#"+id); if (inp) inp.classList.toggle("invalid", !!key); }
function validate(){
  let ok = true;
  const name = $("#name").value.trim(), email = $("#email").value.trim(), cc = $("#cc").value, ph = $("#phone").value.replace(/[\s()-]/g,"");
  setErr("name", name.length >= 2 ? "" : (ok = false, "e_name"));
  setErr("email", /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) ? "" : (ok = false, "e_email"));
  const phOK = cc === "+65" ? /^[89]\d{7}$/.test(ph.replace(/^\+?65/,"")) : /^\+?\d{6,15}$/.test(ph);
  setErr("phone", phOK ? "" : (ok = false, cc === "+65" ? "e_phone" : "e_phone_int"));
  $("#e_consent").textContent = $("#consent").checked ? "" : (ok = false, t("e_consent"));
  return ok;
}
["name","email","phone"].forEach(id => $("#"+id).addEventListener("blur", () => { if ($("#"+id).value) validate(); }));

form.addEventListener("submit", async e => {
  e.preventDefault(); $("#e_form").textContent = "";
  if (!validate()) { const f = form.querySelector(".invalid") || $("#consent"); f.focus(); return; }
  const cc = $("#cc").value, ph = $("#phone").value.replace(/[\s()-]/g,"");
  const data = {
    name: $("#name").value.trim(), email: $("#email").value.trim().toLowerCase(),
    phone: cc === "other" ? ph : cc + " " + (cc === "+65" ? ph.replace(/^\+?65/,"") : ph),
    seats: form.seats.value, kaion: form.kaion.value || "", question: $("#question").value.trim(),
    heard: $("#heard").value, source: SRC, updates: $("#updates").checked ? "Yes" : "No",
    lang: L, consent: "Yes", website: $("#website").value
  };
  const btn = $("#submit"); btn.disabled = true; btn.firstElementChild.textContent = t("sending");
  try {
    const res = await send(data);
    lastResult = { ...res, first: data.name };
    showDone(lastResult); refreshCount();
    $("#join").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) {
    $("#e_form").textContent = err.message === "full" ? t("e_full") : t("e_net");
  } finally { btn.disabled = false; btn.firstElementChild.textContent = t("submit"); }
});

async function send(data){
  if (DEMO) {
    await sleep(600);
    const rows = demoRows();
    if (rows.some(r => r.email === data.email)) return { ok: true, duplicate: true };
    rows.push({ ...data, at: new Date().toISOString() }); store.set("kmy_demo_rows", JSON.stringify(rows));
    return { ok: true };
  }
  let r;
  try {
    // a plain string body is sent as text/plain, so Apps Script answers without a CORS preflight
    r = await fetch(CONFIG.endpoint, { method: "POST", body: JSON.stringify(data) });
  } catch (e) {
    // if the browser refuses to read the reply, send once more without reading it; the sheet still gets the row
    await fetch(CONFIG.endpoint, { method: "POST", mode: "no-cors", body: JSON.stringify(data) });
    return { ok: true };
  }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "net");
  return j;
}

function calLink(){
  const f = s => new Date(s).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const q = new URLSearchParams({ action: "TEMPLATE", text: "KAION × Mind Yoga", dates: `${f(CONFIG.startAt)}/${f(CONFIG.endAt)}`,
    details: location.href.split("#")[0], location: CONFIG.venue.en, ctz: "Asia/Singapore" });
  return "https://calendar.google.com/calendar/render?" + q;
}
function showDone(r){
  const box = $("#formBox");
  const key = r.duplicate ? "dup" : r.waitlist ? "wait" : "ok";
  const share = "https://wa.me/?text=" + encodeURIComponent(t("share_txt") + " " + location.href.split("#")[0].split("?")[0]);
  const v = k => CONFIG[k][L] || CONFIG[k].en;
  box.innerHTML = `<div class="done" role="status"><div class="tick"><span class="m-bf"></span></div><h3></h3><p></p>
    <dl class="facts"><div class="fact"><dt></dt><dd></dd></div><div class="fact"><dt></dt><dd></dd></div></dl>
    <div class="acts"><a class="btn sm" target="_blank" rel="noopener" id="calA"></a><a class="btn sm ghost" target="_blank" rel="noopener" id="shareA"></a><button class="btn sm ghost" type="button" id="again"></button></div></div>`;
  box.querySelector("h3").textContent = t(key + "_h").replace("{n}", r.first);
  box.querySelector("p").textContent = t(key + "_p");
  const dts = box.querySelectorAll("dt"), dds = box.querySelectorAll("dd");
  dts[0].textContent = t("f_date"); dds[0].textContent = v("date"); dts[1].textContent = t("f_time"); dds[1].textContent = v("time");
  $("#calA").href = CONFIG.startAt ? calLink() : "#"; $("#calA").textContent = t("cal"); $("#calA").hidden = !CONFIG.startAt;
  $("#shareA").href = share; $("#shareA").textContent = t("share");
  $("#again").textContent = t("again");
  $("#again").onclick = () => { lastResult = null; box.innerHTML = ""; box.append(form); form.reset(); applyLang(); $("#name").focus(); };
}

applyLang(); refreshCount(); setInterval(refreshCount, 30000);

{ const hv = { flyer: "Flyer", ig: "Instagram", instagram: "Instagram" }[SRC.toLowerCase()]; if (hv) $("#heard").value = hv; }
